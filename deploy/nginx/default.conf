server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index static/html/index.html;
    charset utf-8;
    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend http://api:8000;
        proxy_pass $api_backend$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }

    # 화면 주소로 직접 접속하거나 새로고침할 때도 앱을 실행합니다.
    location ~ ^/calendar/all/?$ {
        return 302 /calendar/team;
    }

    location ~ ^/(login|requests(/(sent|received|consents|new|[1-9][0-9]*(/renegotiate)?))?|schedules/(new|[1-9][0-9]*)|history|calendar/(team|my))/?$ {
        try_files /static/html/index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = / {
        try_files /static/html/index.html =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
