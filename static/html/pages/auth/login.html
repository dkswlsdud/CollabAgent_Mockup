<!-- auth-page -->
<template id="auth-page">
  <div class="auth-layout">
    <section class="auth-story">
      <a class="auth-brand" href="#">Collab Agent</a>
      <div class="auth-story-copy">
        <span class="eyebrow">BETTER WORK, TOGETHER</span>
        <h1>
          좋은 협업은
          <br />
          명확한 요청에서
          <br />
          시작됩니다
          <span>.</span>
        </h1>
        <p>
          동료의 일정을 살피고, 서로의 조건을 맞추고.
          <br />
          요청부터 합의까지 한곳에서 이어가세요.
        </p>
        <div class="auth-visual">
          <div class="floating-request">
            <span>↗ 협업 요청</span>
            <b>신제품 홍보 배너 제작</b>
            <small>마케팅팀 → 디자인팀</small>
          </div>
          <div class="floating-agreement">
            <span>✓</span>
            <div>
              <b>함께 정한 일정</b>
              <small>서로 확인한 조건으로 시작해요.</small>
            </div>
          </div>
          <div class="orbit"></div>
        </div>
      </div>
      <small class="auth-caption">사내 협업을 위한 작은 시작, Collab Agent</small>
    </section>
    <section class="auth-form-area">
      <div class="auth-card">
        <div class="eyebrow">EMPLOYEE LOGIN</div>
        <h2>직원 로그인</h2>
        <p class="subtitle">등록된 직원 아이디와 비밀번호로 로그인하세요.</p>
        <form id="auth-form">
          <div class="field">
            <label for="auth-login-id">아이디</label>
            <input
              id="auth-login-id"
              type="text"
              autocomplete="username"
              maxlength="50"
              required
              placeholder="직원 아이디"
            />
          </div>
          <div class="field">
            <label for="auth-password">비밀번호</label>
            <input
              id="auth-password"
              type="password"
              autocomplete="current-password"
              maxlength="128"
              required
              placeholder="비밀번호"
            />
          </div>
          <p id="auth-error" class="form-error" role="alert"></p>
          <button class="primary auth-submit" type="submit">로그인 →</button>
        </form>
        {{demoAccount}}
        <p class="hint">실제 MySQL 데이터로 동작하는 개발용 화면입니다.</p>
      </div>
    </section>
  </div>
</template>

<!-- demo-account -->

  <div class="test-account">
    <strong>테스트 계정 선택</strong>
    <div class="demo-account-buttons">
      <button type="button" onclick="fillDemo('minji.kim')">김민지</button></br>
      <button type="button" onclick="fillDemo('seojun.lee')">이서준</button></br>
      <button type="button" onclick="fillDemo('jihoon.park')">박지훈</button></br>
      <button type="button" onclick="fillDemo('haeun.jung')">정하은</button></br>
      <button type="button" onclick="fillDemo('yujin.choi')">최유진</button>
    </div>
    <small>계정을 누르면 아이디와 비밀번호가 자동 입력됩니다.</small>
  </div>
</template>
