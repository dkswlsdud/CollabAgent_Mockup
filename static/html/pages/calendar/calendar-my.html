<template id="calendar-my-page">
  <div class="content">
    {{heading}}
    <section class="panel calendar-panel">
      {{toolbar}}
      <div id="calendar-body" class="calendar-loading">월별 일정을 불러오고 있어요…</div>
    </section>
    <p class="hint">
      일정을 누르면 상세 정보를 볼 수 있습니다. 여러 날에 걸친 일정은 이어진 띠로 표시합니다. 시간은
      한국 시간 기준입니다.
    </p>
  </div>
</template>
