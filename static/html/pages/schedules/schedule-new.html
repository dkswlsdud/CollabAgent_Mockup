<template id="schedule-new-page">
  <div class="content screen-page">
    <div class="page-heading">
      <div>
        <div class="eyebrow">COLLAB AGENT</div>
        <h1>내 일정 추가</h1>
        <p class="subtitle">내 업무·회의·개인 일정을 등록하세요.</p>
      </div>
      <button class="secondary" onclick="navigate('calendar')">목록으로</button>
    </div>
    <section class="panel screen-panel">
      <div class="screen-body">
        <form id="schedule-form">
          <p class="subtitle" style="margin-bottom: 20px">
            {{employeeName}} 님의 일정으로 저장합니다.
          </p>
          <div class="field">
            <label for="schedule-title">일정 이름</label>
            <input
              id="schedule-title"
              maxlength="255"
              required
              placeholder="예: 캠페인 기획 회의"
            />
          </div>
          <div class="two-col">
            <div class="field">
              <label for="schedule-type">유형</label>
              <select id="schedule-type">
                {{typeOptions}}
              </select>
            </div>
            <div class="field">
              <label for="schedule-priority">우선순위</label>
              <select id="schedule-priority">
                <option value="MEDIUM">보통</option>
                <option value="HIGH">높음</option>
                <option value="LOW">낮음</option>
              </select>
            </div>
          </div>
          <div class="two-col">
            <div class="field">
              <label for="schedule-start">시작</label>
              <input
                id="schedule-start"
                type="datetime-local"
                value="{{startDay}}T09:00"
                required
              />
            </div>
            <div class="field">
              <label for="schedule-end">종료</label>
              <input id="schedule-end" type="datetime-local" value="{{endDay}}T10:00" required />
            </div>
          </div>
          <div class="field">
              <label for="schedule-workload">작업량</label>
              <select id="schedule-workload">
                <option value="MEDIUM">보통</option>
                <option value="LOW">적음</option>
                <option value="HIGH">많음</option>
              </select>
          </div>
          <div class="field">
            <label for="schedule-memo">메모</label>
            <textarea id="schedule-memo" rows="2" maxlength="2000"></textarea>
          </div>
          <p class="form-error" id="schedule-error" role="alert"></p>
        </form>
      </div>
      <div class="screen-actions">
        <button class="secondary" onclick="navigate('calendar')">취소</button>
        <button class="primary" type="submit" form="schedule-form">일정 저장</button>
      </div>
    </section>
  </div>
</template>
